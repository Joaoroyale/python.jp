<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <title>Cadastro de Produtos</title>
    <h1>Seja bem-vindo ao cadastro de produtos!</h1>
    <p>Cadastro de produtos:</p>
    
    <label for="produto">Produto:</label>
    <input type="text" placeholder="Qual o produto?" id="produto"><br>

    <label for="descrição">Descrição:</label>
    <input type="text" placeholder="Faça uma descrição" id="descrição"><br>

    <label for="cor">Cor:</label>
    <input type="text" placeholder="Qual a cor?" id="cor"><br>

    <label for="marca">Marca:</label>
    <input type="text" placeholder="Qual a marca?" id="marca"><br>

    <label for="tamanho">Tamanho:</label>
    <input type="number" placeholder="Qual o tamanho?" id="tamanho"><br>

    <label for="Quantidade">Quantidade:
    <input type="number" placeholder="Qual a quantidade?" id="Quantidade"><br>

    <label for="preço_investido">Preço investido:</label>
    <input type="number" placeholder="Qual o preço?" id="preço_investido"><br>

    <label for="preço_venda">Preço de venda:</label>
    <input type="number" placeholder="Qual o preço de venda?" id="preço_venda"><br>

    <label for="observação">Observação:</label>
    <input type="text" placeholder="Adicione uma observação" id="observação"><br>

    <label for="foto_produto">Foto do produto:</label>
    <input type="file" id="foto_produto"><br>

    <button type="submit">Cadastrar Produto</button>


</body>
</html>
